# ============================================================
# 🐾 PATITAS SOS — docker-compose.yml
#
# Levantar con:
#   docker compose --env-file .env.local up --build -d
#
# La app queda expuesta en http://localhost:3000
# ============================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Caché local de npm (~/.npm) para que npm ci funcione sin depender
      # de la red (se copia al contenedor en la etapa deps del Dockerfile)
      additional_contexts:
        npm_cache: ${HOME}/.npm
      args:
        # Se inyectan en build time (se incrustan en el bundle del cliente)
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    image: patitas-sos:latest
    container_name: patitas-sos
    restart: unless-stopped
    # DNS fijo: no depende del resolver del host (cambia con la red WiFi)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # Todas las demás variables (secretas y de configuración) entran
      # desde `.env.local` vía env_file; aquí solo lo que NO está en ella
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
